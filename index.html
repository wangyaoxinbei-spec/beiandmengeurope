<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bei & Meng · Europe Sensory Archives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@300;500&family=Homemade+Apple&display=swap');
        :root { --cream: #F4F1EA; --ink: #322F2B; --olive: #7A8D84; }
        body { background-color: #E5E2D9; color: var(--ink); font-family: 'Noto Serif SC', serif; -webkit-font-smoothing: antialiased; }
        .serif-ital { font-family: 'Bodoni Moda', serif; font-style: italic; }
        .handwritten { font-family: 'Homemade Apple', cursive; }
        .notebook-page { background: var(--cream); box-shadow: 5px 5px 20px rgba(0,0,0,0.05); border-left: 10px solid #D9D4C7; position: relative; }
        .active-dot { fill: var(--olive); r: 6; filter: drop-shadow(0 0 3px rgba(122,141,132,0.4)); }
        .scent-tag { background: #FFFFFF; border: 1px solid #E2E0D5; padding: 10px; transform: rotate(-1deg); box-shadow: 2px 2px 5px rgba(0,0,0,0.02); }
        .audio-wave { height: 2px; background: repeating-linear-gradient(90deg, #7A8D84 0px, #7A8D84 2px, transparent 2px, transparent 4px); width: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-xl mx-auto">
        <section class="mb-10 text-center">
            <svg viewBox="0 0 200 120" class="w-48 mx-auto opacity-60 mb-2">
                <path d="M50,40 Q70,20 100,30 T150,50 T130,100 T80,120 Z" fill="none" stroke="#7A8D84" stroke-width="0.5" />
                <circle cx="75" cy="55" r="3" fill="#CCC" class="cursor-pointer" onclick="switchCity('Paris')" id="dot-Paris" />
                <circle cx="110" cy="85" r="3" fill="#CCC" class="cursor-pointer" onclick="switchCity('Rome')" id="dot-Rome" />
                <circle cx="100" cy="65" r="3" fill="#CCC" class="cursor-pointer" onclick="switchCity('Luzern')" id="dot-Luzern" />
                <circle cx="85" cy="95" r="3" fill="#CCC" class="cursor-pointer" onclick="switchCity('Nice')" id="dot-Nice" />
            </svg>
            <h1 class="serif-ital text-xl tracking-widest text-[#7A8D84]">Europe Archives</h1>
        </section>

        <section class="mb-8">
            <div class="notebook-page p-6 min-h-[300px]">
                <div class="flex justify-between items-baseline mb-6 border-b border-black/5 pb-2">
                    <h3 class="serif-ital text-2xl" id="display-city">Paris</h3>
                    <span class="text-[10px] handwritten opacity-40">Sensory Map</span>
                </div>

                <div class="mb-8">
                    <span class="text-[9px] uppercase tracking-[0.2em] opacity-40 block mb-3">Scents / 气味捕捉</span>
                    <div class="scent-tag inline-block min-w-[150px]">
                        <p class="text-[10px] italic mb-1 opacity-30">Smells like...</p>
                        <p class="text-xs handwritten leading-relaxed outline-none" id="edit-scent" contenteditable="true" onblur="saveCurrentData()">
                            新鲜割下的青草味，混着圣母院旁书报摊的旧纸张香...
                        </p>
                    </div>
                </div>

                <div class="mb-8">
                    <span class="text-[9px] uppercase tracking-[0.2em] opacity-40 block mb-3">Ambient / 声音碎片</span>
                    <div class="bg-white/50 p-4 rounded-xl flex items-center space-x-4 border border-white/30">
                        <button id="record-btn" onclick="toggleRecording()" class="w-10 h-10 rounded-full bg-[#7A8D84] text-white flex items-center justify-center text-xs shadow-lg">REC</button>
                        <div class="flex-1">
                            <div class="audio-wave opacity-30 mb-2"></div>
                            <audio id="audio-player" controls class="h-6 w-full opacity-60"></audio>
                        </div>
                    </div>
                    <p class="text-[8px] mt-2 opacity-30 italic">* 点击录制当下环境音（限制30秒内）</p>
                </div>

                <div>
                    <span class="text-[9px] uppercase tracking-[0.2em] opacity-40 block mb-2">Thoughts / 碎碎念</span>
                    <p class="text-sm leading-relaxed handwritten" id="edit-mood" contenteditable="true" onblur="saveCurrentData()">
                        那一刻，时间好像静止了。
                    </p>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-4 mb-12">
            <div class="bg-white/40 p-3 rounded-2xl text-center cursor-pointer" onclick="triggerUp('ootd')">
                <span class="text-[8px] opacity-40 uppercase block mb-2">Today's OOTD</span>
                <img id="view-ootd" class="hidden rounded-xl w-full aspect-[3/4] object-cover">
                <div id="ph-ootd" class="h-32 flex items-center justify-center bg-gray-100/50 rounded-xl text-[10px] opacity-20 italic">UPLOAD</div>
            </div>
            <div class="bg-white/40 p-3 rounded-2xl text-center cursor-pointer" onclick="triggerUp('item')">
                <span class="text-[8px] opacity-40 uppercase block mb-2">Artifact</span>
                <img id="view-item" class="hidden rounded-xl w-full aspect-[3/4] object-contain">
                <div id="ph-item" class="h-32 flex items-center justify-center bg-gray-100/50 rounded-xl text-[10px] opacity-20 italic">COLLECT</div>
            </div>
        </section>

        <input type="file" id="input-ootd" class="hidden" onchange="handleFile(this, 'ootd')">
        <input type="file" id="input-item" class="hidden" onchange="handleFile(this, 'item')">

        <footer class="text-center pb-12 opacity-20 text-[8px] tracking-[0.5em]">
            B & M · EUROPE SENSORY 2026
        </footer>
    </div>

    <script>
        let currentCity = 'Paris';
        let mediaRecorder;
        let audioChunks = [];

        function switchCity(city) {
            currentCity = city;
            document.querySelectorAll('circle').forEach(c => c.classList.remove('active-dot'));
            document.getElementById(`dot-${city}`).classList.add('active-dot');
            document.getElementById('display-city').innerText = city;
            loadCityData(city);
        }

        // 声音录制逻辑
        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64 = reader.result;
                        localStorage.setItem(`audio-${currentCity}`, base64);
                        document.getElementById('audio-player').src = base64;
                    };
                    reader.readAsDataURL(audioBlob);
                    btn.innerText = 'REC';
                    btn.classList.remove('animate-pulse');
                };
                mediaRecorder.start();
                btn.innerText = '...';
                btn.classList.add('animate-pulse');
                setTimeout(() => { if(mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 30000);
            } else {
                mediaRecorder.stop();
            }
        }

        function triggerUp(id) { document.getElementById(`input-${id}`).click(); }

        function handleFile(input, key) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(`view-${key}`).src = e.target.result;
                    document.getElementById(`view-${key}`).classList.remove('hidden');
                    document.getElementById(`ph-${key}`).classList.add('hidden');
                    localStorage.setItem(`file-${currentCity}-${key}`, e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function saveCurrentData() {
            const data = {
                scent: document.getElementById('edit-scent').innerText,
                mood: document.getElementById('edit-mood').innerText
            };
            localStorage.setItem(`text-${currentCity}`, JSON.stringify(data));
        }

        function loadCityData(city) {
            const t = JSON.parse(localStorage.getItem(`text-${city}`));
            document.getElementById('edit-scent').innerText = t?.scent || "Smells like...";
            document.getElementById('edit-mood').innerText = t?.mood || "那一刻...";
            
            // 加载声音
            const s = localStorage.getItem(`audio-${city}`);
            document.getElementById('audio-player').src = s || '';

            // 加载照片
            ['ootd', 'item'].forEach(k => {
                const f = localStorage.getItem(`file-${city}-${k}`);
                const v = document.getElementById(`view-${k}`);
                const p = document.getElementById(`ph-${k}`);
                if (f) { v.src = f; v.classList.remove('hidden'); p.classList.add('hidden'); }
                else { v.classList.add('hidden'); p.classList.remove('hidden'); }
            });
        }

        window.onload = () => switchCity('Paris');
    </script>
</body>
</html>
