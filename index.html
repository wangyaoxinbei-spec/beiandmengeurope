<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bei & Meng · Europe Vibe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@300;500&display=swap');
        :root { --cream: #F9F8F3; --olive: #7A8D84; }
        body { background-color: var(--cream); color: #4A4540; font-family: 'Noto Serif SC', serif; -webkit-font-smoothing: antialiased; }
        .serif-ital { font-family: 'Bodoni Moda', serif; font-style: italic; }
        .glass-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; }
        .active-city { border: 1px solid var(--olive); opacity: 1 !important; }
        [contenteditable]:focus { outline: none; border-bottom: 1px dashed var(--olive); }
        .photo-slot { aspect-ratio: 3/4; background: #EEECE4; border-radius: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-md mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl serif-ital mb-2 text-[#7A8D84]">Europe Summer</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] opacity-60 italic">Bei & Meng's Interactive Journal</p>
        </header>

        <section class="mb-10">
            <div id="city-list" class="flex overflow-x-auto space-x-3 pb-4 no-scrollbar">
                <span onclick="switchCity('Paris')" class="city-tag active-city px-4 py-1 glass-card text-xs whitespace-nowrap opacity-50" id="tag-Paris">Paris 🇫🇷</span>
                <span onclick="switchCity('Rome')" class="city-tag px-4 py-1 glass-card text-xs whitespace-nowrap opacity-50" id="tag-Rome">Rome 🇮🇹</span>
                <span onclick="switchCity('Luzern')" class="city-tag px-4 py-1 glass-card text-xs whitespace-nowrap opacity-50" id="tag-Luzern">Luzern 🇨🇭</span>
                <span onclick="switchCity('Nice')" class="city-tag px-4 py-1 glass-card text-xs whitespace-nowrap opacity-50" id="tag-Nice">Nice 🇫🇷</span>
            </div>
        </section>

        <section class="mb-10">
            <h2 class="text-xs font-light tracking-[0.2em] mb-4 flex items-center">
                <span class="w-8 h-[1px] bg-[#7A8D84] mr-3"></span>OOTD / 今日穿搭
            </h2>
            <div class="photo-slot glass-card" onclick="document.getElementById('photo-input').click()">
                <div id="photo-placeholder" class="text-center opacity-40">
                    <p class="text-2xl mb-1">+</p>
                    <p class="text-[9px] uppercase tracking-tighter">Upload Vibe Photo</p>
                </div>
                <img id="display-photo" class="hidden">
            </div>
            <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="handleUpload(this)">
        </section>

        <section class="mb-10">
            <h2 class="text-xs font-light tracking-[0.2em] mb-6 flex items-center">
                <span class="w-8 h-[1px] bg-[#7A8D84] mr-3"></span><span id="current-city-name">Paris</span> · 行程
            </h2>
            <div class="space-y-4">
                <div class="glass-card p-6">
                    <span class="text-[10px] serif-ital opacity-50 block mb-2">Morning / 午前</span>
                    <p class="text-sm edit-text" id="plan-morning" contenteditable="true" onblur="saveData()">点击编辑上午的松弛计划...</p>
                </div>
                <div class="glass-card p-6 text-mist-blue">
                    <span class="text-[10px] serif-ital opacity-50 block mb-2">Evening / 夜晚</span>
                    <p class="text-sm edit-text" id="plan-evening" contenteditable="true" onblur="saveData()">留白给惊喜，或输入你的心情...</p>
                </div>
            </div>
        </section>

        <section class="mb-10">
            <div class="glass-card p-6 bg-[#7A8D84]/5">
                <h3 class="text-[10px] font-bold mb-4 tracking-widest text-[#7A8D84] uppercase">Shared Expenses</h3>
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <span class="text-3xl serif-ital font-light" id="bill-euro" contenteditable="true" onblur="saveData()">0.00</span>
                        <span class="text-[10px] ml-2 opacity-50">€</span>
                    </div>
                </div>
                <p class="text-[9px] opacity-40 italic">点击金额直接修改，记得标注垫付人哦</p>
            </div>
        </section>

        <footer class="text-center pb-20">
            <p class="text-[9px] tracking-[0.4em] opacity-30 italic">CITY: <span id="footer-city">PARIS</span></p>
        </footer>
    </div>

    <script>
        let currentCity = 'Paris';

        // 1. 切换城市逻辑
        function switchCity(city) {
            currentCity = city;
            // 更新 UI 样式
            document.querySelectorAll('.city-tag').forEach(tag => tag.classList.remove('active-city'));
            document.getElementById(`tag-${city}`).classList.add('active-city');
            
            // 更新文字内容
            document.getElementById('current-city-name').innerText = city;
            document.getElementById('footer-city').innerText = city.toUpperCase();
            
            // 加载该城市的本地数据
            loadData(city);
        }

        // 2. 照片上传处理
        function handleUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('display-photo');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('photo-placeholder').classList.add('hidden');
                    // 保存照片到本地 (注意：localStorage 空间有限，建议仅存一张)
                    localStorage.setItem(`photo-${currentCity}`, e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        // 3. 数据保存与加载
        function saveData() {
            const data = {
                morning: document.getElementById('plan-morning').innerText,
                evening: document.getElementById('plan-evening').innerText,
                bill: document.getElementById('bill-euro').innerText
            };
            localStorage.setItem(`data-${currentCity}`, JSON.stringify(data));
        }

        function loadData(city) {
            const savedData = JSON.parse(localStorage.getItem(`data-${city}`));
            if (savedData) {
                document.getElementById('plan-morning').innerText = savedData.morning;
                document.getElementById('plan-evening').innerText = savedData.evening;
                document.getElementById('bill-euro').innerText = savedData.bill;
            } else {
                document.getElementById('plan-morning').innerText = "点击编辑上午计划...";
                document.getElementById('plan-evening').innerText = "点击编辑夜晚计划...";
                document.getElementById('bill-euro').innerText = "0.00";
            }

            const savedPhoto = localStorage.getItem(`photo-${city}`);
            const img = document.getElementById('display-photo');
            if (savedPhoto) {
                img.src = savedPhoto;
                img.classList.remove('hidden');
                document.getElementById('photo-placeholder').classList.add('hidden');
            } else {
                img.classList.add('hidden');
                document.getElementById('photo-placeholder').classList.remove('hidden');
            }
        }

        // 页面初始化
        window.onload = () => loadData('Paris');
    </script>
</body>
</html>
